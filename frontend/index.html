<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusConnect - College Event Platform</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS with Stitch Theme Tokens -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#5442de",
              "primary-container": "#6d5ef8",
              "on-primary": "#ffffff",
              secondary: "#10b981",
              "secondary-container": "#6cf8bb",
              tertiary: "#f97360",
              "tertiary-container": "#ffdad4",
              background: "#f8f9ff",
              surface: "#f8f9ff",
              "on-surface": "#0d1c2e",
              "on-surface-variant": "#475569",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#eff4ff",
              "surface-container": "#e6eeff",
              "outline-variant": "#c8c4d8",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              heading: ["Plus Jakarta Sans", "sans-serif"],
            },
            borderRadius: {
              xl: "0.75rem",
              lg: "0.5rem",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8f9ff;
        color: #0d1c2e;
      }
      h1, h2, h3, h4 {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#f8f9ff] min-h-screen text-[#0d1c2e]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
